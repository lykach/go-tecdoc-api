openapi: 3.0.3
info:
  title: Go TecDoc API
  version: 1.2.6
  description: Read-only TecDoc 2024Q1 REST API production baseline. All protected routes use X-API-Key. Large collections
    are bounded and paged; malformed query parameters are rejected with HTTP 400; raw source-table access is available under
    /api/v1/datasets.
  x-production-baseline: tecdoc2024q1-final
servers:
- url: http://localhost:8081
  description: Local/server deployment
tags:
- name: Discovery
- name: Localization
- name: Suppliers
- name: Manufacturers
- name: Vehicles
- name: Catalog
- name: Articles
- name: Search
- name: Enrichment
- name: Datasets
- name: Exports
paths:
  /api/v1/languages:
    get:
      tags:
      - Localization
      operationId: GetLanguages
      summary: Get Languages
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server/database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id001
          description: API key inactive/expired or IP/route not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id002
          description: API key rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current per-key rate-limit window resets.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests-per-minute limit for this API key.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/languages/{id}:
    get:
      tags:
