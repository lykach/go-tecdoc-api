  /api/v1/import/vehicle-stats:
    get:
      tags:
      - Vehicles
      operationId: GetVehicleImportStats
      summary: Get aggregate vehicle import counts without paged fan-out
      description: Returns exact TecDoc source-table counts for the selected vehicle types. Intended for bulk-import previews so clients do not enumerate every manufacturer/model/vehicle page merely to calculate totals.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vehicle_types
        in: query
        required: false
        description: Comma-separated subset of PC, LCV, E-PC, E-LCV, CV, Motorcycle, Engine. Omit for all types.
        schema:
          type: string
      responses:
        '200':
          description: Aggregate import statistics
          content:
            application/json:
              schema:
                type: object
                required:
                - vehicle_types
                - manufacturers_total
                - models_total
                - vehicles_total
                - engines_total
                - by_type
                properties:
                  vehicle_types:
                    type: array
                    items:
                      type: string
                  manufacturers_total:
                    type: integer
                  models_total:
                    type: integer
                  vehicles_total:
                    type: integer
                  engines_total:
                    type: integer
                  by_type:
                    type: object
                    additionalProperties:
                      type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server/database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id001
        '429': *id002
  /api/v1/import/product-groups:
    get:
      tags:
      - Catalog
      operationId: GetImportProductGroups
      summary: Get flat paged product-group tree for bulk import
      description: Returns a stable flat SEARCH_TREE page for the selected target families. This endpoint is intended for bulk synchronization and avoids one HTTP request per tree node. Passenger subtypes are mapped to the PC tree family.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vehicle_types
        in: query
        required: false
        description: Comma-separated subset of PC, LCV, E-PC, E-LCV, CV, Motorcycle, Engine. Passenger subtypes use the PC tree.
        schema:
          type: string
      - name: language_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Flat import page
          content:
            application/json:
              schema:
                type: object
                required:
                - vehicle_types
                - categories
                - total
                - limit
                - offset
                properties:
                  vehicle_types:
                    type: array
                    items:
                      type: string
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server/database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id001
        '429': *id002
  /api/v1/import/vehicle-product-groups:
    get:
      tags:
      - Catalog
      operationId: GetImportVehicleProductGroups
      summary: Get product groups for many vehicles in one importer request
      description: Returns applicable root SEARCH_TREE categories grouped by TecDoc vehicle ID. Intended for bulk vehicle synchronization to avoid one HTTP and SQL round trip per vehicle. Passenger subtypes use vehicle_type=PC.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vehicle_type
        in: query
        required: true
        schema:
          type: string
          enum: [PC, CV, Motorcycle]
      - name: vehicle_ids
        in: query
        required: true
        description: Comma-separated positive TecDoc vehicle IDs, maximum 500 IDs.
        schema:
          type: string
      - name: language_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: ids_only
        in: query
        required: false
        description: When true, returns only category_ids per vehicle and skips SEARCH_TREE text/metadata lookup. Recommended for server-to-server full imports.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Vehicle product groups grouped by vehicle ID
          content:
            application/json:
              schema:
                type: object
                required:
                - vehicle_type
                - items
                properties:
                  vehicle_type:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - vehicle_id
                      properties:
                        vehicle_id:
                          type: integer
                        categories:
                          description: Full category metadata when ids_only=false.
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        category_ids:
                          description: Compact root SEARCH_TREE ids when ids_only=true.
                          type: array
                          items:
                            type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server/database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id001
        '429': *id002
